<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闲逛 · 三国挂机 V1</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="boot">
      <div class="boot-box">
        <div class="boot-title">闲逛</div>
        <div class="boot-text" id="boot-text">正在读取配置…</div>
      </div>
    </div>

    <div id="app" hidden>
      <header id="topbar">
        <div class="brand">
          <span class="brand-name">闲逛</span>
        </div>
        <div class="top-stats" id="top-stats"></div>
      </header>

      <div id="taskbar">
        <div class="tb-row">
          <span class="tb-name" id="tb-name">待命</span>
          <span class="tb-target" id="tb-target">—</span>
          <span class="tb-remain" id="tb-remain">—</span>
        </div>
        <div class="bar big"><i id="tb-bar"></i></div>
      </div>

      <main id="main">
        <section id="map-pane">
          <canvas id="map"></canvas>
          <nav id="left-menu">
            <button class="menu-item" id="menu-bag">
              <span class="mi-ico">袋</span><span class="mi-txt">背包</span>
            </button>
            <button class="menu-item" id="menu-char">
              <span class="mi-ico">将</span><span class="mi-txt">角色</span>
            </button>
            <button class="menu-item" id="menu-rel">
              <span class="mi-ico">缘</span><span class="mi-txt">关系</span>
              <span class="mi-dot" hidden></span>
            </button>
            <button class="menu-item" id="menu-event">
              <span class="mi-ico">事</span><span class="mi-txt">事件</span>
              <span class="mi-dot count" hidden></span>
            </button>
          </nav>
          <div class="map-overlay">
            <div class="map-tools">
              <button class="mini" id="btn-fit" title="适配窗口">适配</button>
              <button class="mini" id="btn-zoomin">＋</button>
              <button class="mini" id="btn-zoomout">－</button>
            </div>
            <div class="map-hint">滚轮缩放 · 拖动平移</div>
          </div>
        </section>

        <aside id="side">
          <section class="card" id="board-card">
            <h2>
              任务板
              <span class="h2-actions">
                <span class="board-total" id="board-total">—</span>
                <button class="mini" id="btn-autosort" title="贪心：每次选最近的">一键最优排序</button>
              </span>
            </h2>
            <div id="task-board" class="task-board"></div>
            <p class="tip">拖动卡片可改变顺序（队首已锁定）· 完成的任务出列，180 秒后新任务补到队尾</p>
          </section>

          <section class="card" id="feed-card">
            <h2>事件流</h2>
            <div id="feed-body" class="feed"></div>
          </section>

          <section class="card dev-card">
            <details id="dev-drawer">
              <summary>开发者 / 存档 / 自检</summary>
              <div class="dev-body">
                <div id="ctrl-body"></div>
                <h2 class="dev-sub">配置与路网自检</h2>
                <div id="check-body"></div>
                <div class="kv"><span>配置</span><b id="meta-line">—</b></div>
              </div>
            </details>
          </section>
        </aside>
      </main>
    </div>

    <div id="modal-wrap" hidden>
      <div id="modal" role="dialog" aria-modal="true">
        <header>
          <h3 id="modal-title">—</h3>
          <button class="mini" id="modal-close" title="关闭">✕</button>
        </header>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="float-wrap"></div>
    <div id="toast-wrap"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
