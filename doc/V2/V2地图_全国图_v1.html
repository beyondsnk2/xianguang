<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 全国地图 · 42 城 · 14 州</title>
<style>
  :root{
    --page-bg:#F2F4F7; --card-bg:#FFFFFF; --card-border:#E3E6EB;
    --text:#232A33; --muted:#6B7480;
  }
  @media (prefers-color-scheme: dark){
    :root{ --page-bg:#15181D; --card-bg:#1D2128; --card-border:#2C323B; --text:#E6E9EE; --muted:#98A2AE; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page-bg);color:var(--text);
       font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:1320px;margin:0 auto;padding:24px 24px 40px}
  header h1{font-size:20px;margin:0 0 6px;letter-spacing:.5px}
  header p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
  .card{margin-top:16px;background:var(--card-bg);border:1px solid var(--card-border);
        border-radius:12px;padding:12px;overflow:auto}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend .item{display:flex;align-items:center;gap:6px}
  .swatch{width:12px;height:12px;border-radius:3px}
  .dot{width:11px;height:11px;border-radius:50%;background:#43506B;display:inline-block}
  .dot.seat{width:13px;height:13px;background:#1F2A44;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #1F2A44}
  .dot.cap{width:15px;height:15px;background:#B03030;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #B03030}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
  .city{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>V2 全国地图 · 42 城 · 14 州</h1>
    <p>网格 60 × 45 ｜ 42 城 ｜ 道路 67 条 ｜ 州仅作地理分组（M9）｜ 港城 13 座<br>
       底图参照三国志系列历代全国图的地形语汇：海岸线 + 主要山脉 + 黄河／长江／淮河／汉水／珠江水系。</p>
  </header>

  <div class="card"><div id="map"></div></div>
  <div class="legend" id="legend"></div>
  <div class="hint">悬停城市可高亮它的直连道路与相邻城市。</div>
</div>

<script>
const CELL = 20, COLS = 60, ROWS = 45;
const W = COLS * CELL, H = ROWS * CELL;

const STATE_COLORS = {
  '幽州':'#5B8FD6', '并州':'#A98BD4', '冀州':'#DE7C7C', '青州':'#4FBFA6',
  '司隶':'#E0A24F', '兖州':'#BCC45E', '徐州':'#4FB2D8', '豫州':'#D97FAE',
  '雍州':'#C9A45E', '凉州':'#9AA0AC', '荆州':'#7CC46E', '扬州':'#40BEA8',
  '益州':'#DB9A62', '交州':'#A6B44E'
};

// name, state, col, row, type(cap|seat|city), port
const CITIES = [
  ['襄平','幽州',50,4,'city',1],
  ['北平','幽州',45,6,'city',0],
  ['蓟','幽州',41,8,'seat',0],
  ['晋阳','并州',30,13,'seat',0],
  ['上党','并州',34,16,'city',0],
  ['南皮','冀州',42,11,'city',0],
  ['平原','冀州',41,14,'city',0],
  ['邺','冀州',37,15,'seat',0],
  ['北海','青州',50,15,'seat',1],
  ['济南','青州',46,15,'city',0],
  ['洛阳','司隶',31,21,'cap',0],
  ['河内','司隶',32,18,'city',0],
  ['濮阳','兖州',40,17,'seat',0],
  ['陈留','兖州',37,20,'city',0],
  ['小沛','徐州',42,19,'city',0],
  ['下邳','徐州',45,21,'seat',1],
  ['广陵','徐州',47,25,'city',1],
  ['谯','豫州',40,23,'city',0],
  ['许昌','豫州',35,23,'seat',0],
  ['汝南','豫州',36,26,'city',0],
  ['长安','雍州',25,20,'seat',0],
  ['安定','雍州',21,16,'city',0],
  ['天水','雍州',18,19,'city',0],
  ['武威','凉州',10,14,'seat',0],
  ['西平','凉州',12,18,'city',0],
  ['宛','荆州',29,24,'city',0],
  ['新野','荆州',31,26,'city',0],
  ['襄阳','荆州',32,28,'seat',0],
  ['江陵','荆州',29,32,'city',1],
  ['江夏','荆州',38,31,'city',1],
  ['长沙','荆州',31,38,'city',0],
  ['建业','扬州',45,27,'seat',1],
  ['吴','扬州',48,28,'city',1],
  ['会稽','扬州',50,31,'city',1],
  ['庐江','扬州',43,29,'city',1],
  ['柴桑','扬州',40,35,'city',1],
  ['汉中','益州',23,24,'city',0],
  ['梓潼','益州',18,27,'city',0],
  ['成都','益州',14,30,'seat',0],
  ['江州','益州',20,34,'city',1],
  ['交趾','交州',26,42,'seat',0],
  ['南海','交州',36,43,'city',1]
];

const EDGES = [
  ['襄平','北平'],['北平','蓟'],['蓟','南皮'],['蓟','晋阳'],
  ['晋阳','上党'],['晋阳','邺'],['晋阳','河内'],['上党','洛阳'],['上党','邺'],
  ['邺','南皮'],['邺','平原'],['南皮','平原'],['平原','济南'],['邺','濮阳'],['平原','濮阳'],['邺','河内'],
  ['济南','北海'],['北海','下邳'],['南皮','北海'],
  ['洛阳','河内'],['洛阳','陈留'],['洛阳','宛'],['洛阳','长安'],
  ['濮阳','陈留'],['濮阳','小沛'],['陈留','许昌'],
  ['下邳','小沛'],['下邳','广陵'],['小沛','谯'],['广陵','建业'],['广陵','庐江'],
  ['许昌','汝南'],['许昌','宛'],['汝南','谯'],['汝南','襄阳'],
  ['长安','天水'],['长安','安定'],['长安','汉中'],['天水','武威'],['天水','汉中'],['安定','武威'],['武威','西平'],
  ['襄阳','宛'],['襄阳','新野'],['襄阳','江陵'],['新野','宛'],['江陵','江夏'],['江陵','长沙'],
  ['江夏','柴桑'],['长沙','柴桑'],['江陵','汉中'],['长沙','南海'],['江夏','长沙'],['江夏','庐江'],['江陵','江州'],
  ['建业','吴'],['吴','会稽'],['建业','庐江'],['庐江','柴桑'],['会稽','南海'],
  ['汉中','梓潼'],['梓潼','成都'],['成都','江州'],['江州','汉中'],['江州','交趾'],['成都','汉中'],
  ['南海','交趾']
];

// 海岸线（网格坐标，顺时针）：辽东 → 渤海 → 山东半岛 → 江淮 → 浙闽 → 岭南
const COAST = [
  [59,0],[57,3],[55,6],[52,8],[50,9],[48,12],[46,14],[47,16],[52,17],[54,19],
  [52,22],[50,25],[51,28],[53,31],[54,34],[54,38],[52,42],[48,45],[59,45]
];
// 北部湾（交趾外侧）
const GULF = [[0,45],[0,39],[9,41],[17,44],[24,46],[0,46]];

const RIVERS = [
  {n:'黄河', w:3.2, pts:[[5,17],[13,15],[20,16],[27,18],[32,20],[38,18],[43,16],[47,15]]},
  {n:'长江', w:3.2, pts:[[14,30],[20,34],[26,33],[29,32],[34,32],[38,31],[42,29],[45,27],[49,28]]},
  {n:'汉水', w:2.0, pts:[[23,24],[28,26],[31,28],[33,30]]},
  {n:'淮河', w:2.0, pts:[[33,24],[38,25],[42,24],[46,23]]},
  {n:'珠江', w:2.0, pts:[[30,40],[33,42],[36,43]]}
];

const RANGES = [
  {n:'燕山', a:[38,5], b:[45,5], c:6},
  {n:'太行', a:[32,10], b:[35,17], c:6},
  {n:'秦岭', a:[20,22], b:[28,22], c:6},
  {n:'大巴山', a:[19,26], b:[25,27], c:5},
  {n:'南岭', a:[28,39], b:[35,40], c:6},
  {n:'阴山', a:[8,8], b:[26,8], c:8},
  {n:'祁连', a:[8,17], b:[13,21], c:5}
];

const STATE_LABELS = [
  ['幽州',46,10],['并州',29,11],['冀州',39,12],['青州',49,12],
  ['司隶',28,19],['兖州',38,14],['徐州',46,23],['豫州',37,26],
  ['雍州',22,22],['凉州',8,11],['荆州',33,35],['扬州',46,32],
  ['益州',14,36],['交州',27,40]
];

const p = (c, r) => [c * CELL + CELL / 2, r * CELL + CELL / 2];
const byName = Object.fromEntries(CITIES.map(c => [c[0], c]));

function poly(pts, close) {
  return pts.map(([c, r], i) => (i ? 'L' : 'M') + p(c, r).join(' ')).join(' ') + (close ? ' Z' : '');
}

const parts = [];
parts.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`);

// 陆地
parts.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#F3EDDF"/>`);
// 网格（每 5 格一条）
for (let c = 0; c <= COLS; c += 5) parts.push(`<line x1="${c*CELL}" y1="0" x2="${c*CELL}" y2="${H}" stroke="#000" stroke-opacity="0.045"/>`);
for (let r = 0; r <= ROWS; r += 5) parts.push(`<line x1="0" y1="${r*CELL}" x2="${W}" y2="${r*CELL}" stroke="#000" stroke-opacity="0.045"/>`);

// 海洋
parts.push(`<path d="${poly(COAST, true)}" fill="#CFE1EE"/>`);
parts.push(`<path d="${poly(GULF, true)}" fill="#CFE1EE"/>`);
parts.push(`<path d="${poly(COAST, false)}" fill="none" stroke="#8FB6D0" stroke-width="1.6"/>`);
parts.push(`<path d="${poly(GULF, false)}" fill="none" stroke="#8FB6D0" stroke-width="1.6"/>`);
// 波纹
['渤海','黄海','东海','南海'].forEach((t, i) => {
  const pos = [[47,10],[54,22],[55,36],[40,45]][i];
  parts.push(`<text x="${p(...pos)[0]}" y="${p(...pos)[1]}" fill="#7CA6C4" font-size="12" text-anchor="middle" font-style="italic">${t}</text>`);
});

// 山脉
RANGES.forEach(m => {
  const [x1, y1] = p(...m.a), [x2, y2] = p(...m.b);
  for (let i = 0; i <= m.c; i++) {
    const t = i / m.c, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    parts.push(`<path d="M ${x-7} ${y+3} L ${x} ${y-7} L ${x+7} ${y+3} Z" fill="#C9BCA0" stroke="#B4A585" stroke-width="0.6"/>`);
  }
  parts.push(`<text x="${(x1+x2)/2}" y="${(y1+y2)/2+16}" fill="#9C8E70" font-size="10" text-anchor="middle">${m.n}</text>`);
});

// 河流
RIVERS.forEach(rv => {
  parts.push(`<path d="${poly(rv.pts, false)}" fill="none" stroke="#7FB3D6" stroke-width="${rv.w}" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>`);
  const mid = rv.pts[Math.floor(rv.pts.length / 2)];
  const [mx, my] = p(...mid);
  parts.push(`<text x="${mx}" y="${my-7}" fill="#5E8FB4" font-size="10.5" text-anchor="middle">${rv.n}</text>`);
});

// 州色域
CITIES.forEach(c => {
  const [x, y] = p(c[2], c[3]);
  parts.push(`<circle cx="${x}" cy="${y}" r="52" fill="${STATE_COLORS[c[1]]}" opacity="0.15"/>`);
});
STATE_LABELS.forEach(([n, c, r]) => {
  const [x, y] = p(c, r);
  parts.push(`<text x="${x}" y="${y}" fill="${STATE_COLORS[n]}" fill-opacity="0.55" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="3">${n}</text>`);
});

// 道路
const edgeEls = [];
EDGES.forEach(([a, b], i) => {
  const A = byName[a], B = byName[b];
  const [x1, y1] = p(A[2], A[3]), [x2, y2] = p(B[2], B[3]);
  edgeEls.push(`<line data-i="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#B08968" stroke-width="2" stroke-linecap="round" opacity="0.75"/>`);
});
parts.push(`<g id="edges">${edgeEls.join('')}</g>`);

// 城市
const cityEls = [];
CITIES.forEach(c => {
  const [n, st, col, row, type, port] = c;
  const [x, y] = p(col, row);
  const r = type === 'cap' ? 7 : type === 'seat' ? 5.5 : 4;
  const fill = type === 'cap' ? '#B03030' : type === 'seat' ? '#1F2A44' : '#43506B';
  cityEls.push(`<g class="city" data-name="${n}">`);
  cityEls.push(`<circle cx="${x}" cy="${y}" r="${r+3}" fill="#fff" opacity="0.9"/>`);
  cityEls.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`);
  if (port) cityEls.push(`<circle cx="${x}" cy="${y}" r="${r+2.2}" fill="none" stroke="#2E86AB" stroke-width="1.4" stroke-dasharray="2.5 2"/>`);
  const fs = type === 'city' ? 10 : 11;
  cityEls.push(`<text x="${x}" y="${y - r - 4}" font-size="${fs}" font-weight="${type==='city'?400:700}" text-anchor="middle" fill="#2B2620" stroke="#FDFAF3" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">${n}</text>`);
  cityEls.push(`</g>`);
});
parts.push(`<g id="cities">${cityEls.join('')}</g>`);

parts.push(`</svg>`);
document.getElementById('map').innerHTML = parts.join('');

// 图例
const legend = document.getElementById('legend');
const items = [];
Object.entries(STATE_COLORS).forEach(([n, c]) => items.push(`<span class="item"><span class="swatch" style="background:${c}"></span>${n}</span>`));
items.push(`<span class="item"><span class="dot cap"></span>都城（洛阳）</span>`);
items.push(`<span class="item"><span class="dot seat"></span>州府</span>`);
items.push(`<span class="item"><span class="dot"></span>普通城</span>`);
items.push(`<span class="item"><span style="width:12px;height:12px;border-radius:50%;border:1.4px dashed #2E86AB;display:inline-block"></span>港口城</span>`);
items.push(`<span class="item"><span style="width:16px;height:0;border-top:2px solid #B08968;display:inline-block"></span>道路</span>`);
legend.innerHTML = items.join('');

// 交互：高亮直连
const adj = {};
EDGES.forEach(([a, b]) => {
  (adj[a] = adj[a] || []).push(b);
  (adj[b] = adj[b] || []).push(a);
});
const edgeG = document.getElementById('edges');
const cityG = document.getElementById('cities');

cityG.querySelectorAll('.city').forEach(g => {
  const name = g.dataset.name;
  const idxs = EDGES.map((e, i) => (e[0] === name || e[1] === name) ? i : -1).filter(i => i >= 0);
  const hot = new Set([name, ...(adj[name] || [])]);
  g.addEventListener('mouseenter', () => {
    edgeG.querySelectorAll('line').forEach(l => {
      const on = idxs.includes(+l.dataset.i);
      l.setAttribute('stroke', on ? '#B03030' : '#B08968');
      l.setAttribute('stroke-width', on ? 3 : 2);
      l.setAttribute('opacity', on ? 1 : 0.28);
    });
    cityG.querySelectorAll('.city').forEach(o => o.style.opacity = hot.has(o.dataset.name) ? '1' : '0.32');
  });
  g.addEventListener('mouseleave', () => {
    edgeG.querySelectorAll('line').forEach(l => {
      l.setAttribute('stroke', '#B08968');
      l.setAttribute('stroke-width', 2);
      l.setAttribute('opacity', 0.75);
    });
    cityG.querySelectorAll('.city').forEach(o => o.style.opacity = '1');
  });
});
</script>
</body>
</html>
